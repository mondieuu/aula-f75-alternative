name: Windows build

# Her push'ta Windows kurulum dosyasını derler.
# main'de package.json'daki sürüm için henüz bir release yoksa, v<sürüm> release'ini
# yayınlar; kurulu uygulamalar güncellemeyi buradan çeker.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decide whether to publish a release
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=never
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # Release yoksa ya da kurulum dosyaları eksikse yayınla
            assets=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if ! echo "$assets" | grep -qx 'latest.yml'; then
              publish=always
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $version, publish: $publish"

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Install and launch
        run: .github/scripts/install-and-run.ps1

      - name: Publish release
        if: steps.plan.outputs.publish == 'always'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.plan.outputs.version }}"
          # latest.yml en sona: güncelleme denetimi exe yüklenmeden yeni sürümü görmesin
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/AULA-F75-Setup.exe dist/*.blockmap --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/AULA-F75-Setup.exe dist/*.blockmap \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "AULA F75 ${{ steps.plan.outputs.version }}" --generate-notes --latest
          fi
          gh release upload "$tag" dist/latest.yml --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: AULA-F75-Setup-${{ steps.plan.outputs.version }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
